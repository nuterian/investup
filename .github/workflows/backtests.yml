name: Backtests

# Quarterly: re-run the walk-forward backtests and open a pull request with the
# updated reports. The site reads its hit rates from docs/backtests/*.json, so
# merging the PR updates the numbers the site shows on its next daily build.
#
# Needs Settings -> Actions -> General -> "Allow GitHub Actions to create and
# approve pull requests", plus the INVESTUP_USER_AGENT secret.

on:
  schedule:
    - cron: "41 9 25 1,4,7,10 *" # after each quarter's Form D data set is out
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      INVESTUP_USER_AGENT: ${{ secrets.INVESTUP_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: sec-raw-${{ github.run_id }}
          restore-keys: sec-raw-

      - run: uv sync --locked --extra model
      - run: uv run investup download --source formd
      - run: uv run investup download --source edgar
      - run: uv run investup load --source formd
      - run: uv run investup load --source edgar

      - run: uv run investup backtest --label step_up
      - run: uv run investup backtest --label went_public --horizon 36
      - run: uv run investup backtest --label next_round

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="backtests/$(date +%Y-%m-%d)"
          git switch -c "$branch"
          git add docs/backtests
          if git diff --cached --quiet; then
            echo "Backtest results unchanged."
            exit 0
          fi
          git commit -m "Refresh backtests ($(date +%Y-%m-%d))"
          git push origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" \
            --title "Refresh backtests ($(date +%Y-%m-%d))" \
            --body "Quarterly walk-forward backtests on the latest official Form D data. Check docs/backtests/*.md for changes in AUC, P@100 and hit rates by rank before merging."
