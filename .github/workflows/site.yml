name: Site

# Rebuilds the data from the SEC and deploys the static site to GitHub Pages.
# Needs: repository secret INVESTUP_USER_AGENT ("Name email@example.com") and
# Settings → Pages → Source: GitHub Actions.

on:
  schedule:
    - cron: "17 6 12 * *" # monthly; picks up each new quarterly Form D data set
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      INVESTUP_USER_AGENT: ${{ secrets.INVESTUP_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Raw SEC files only change for new quarters; keep them between runs.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: sec-raw-${{ github.run_id }}
          restore-keys: sec-raw-

      - run: uv sync --locked --extra model
      - run: uv run investup download
      - run: uv run investup load
      - run: uv run investup export --out site/public/data

      - working-directory: site
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
