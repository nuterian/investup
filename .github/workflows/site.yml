name: Site

# Daily: pull new SEC filings, rebuild the data, re-score every company and
# deploy the static site to GitHub Pages.
#
# One-time setup:
#   - Repository secret INVESTUP_USER_AGENT, e.g. "Your Name you@example.com"
#     (the SEC requires a contact in the User-Agent).
#   - Settings -> Pages -> Source: "GitHub Actions".
#
# If any step fails, nothing is deployed and the last good site stays up.

on:
  schedule:
    - cron: "23 7 * * *" # 07:23 UTC, after EDGAR's nightly index update
  workflow_dispatch:

permissions:
  contents: write # keep-alive commit (see the last build step)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The first run fetches every Form D filed since the last quarterly data set
    # (~1 hour at the SEC's rate limit). Later runs take ~30 minutes.
    timeout-minutes: 180
    env:
      INVESTUP_USER_AGENT: ${{ secrets.INVESTUP_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Raw SEC files (~500 MB) only grow; keep them between runs.
      - uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: sec-raw-${{ github.run_id }}
          restore-keys: sec-raw-

      - run: uv sync --locked --extra model
      - run: uv run investup download

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/raw
          key: sec-raw-${{ github.run_id }}

      - run: uv run investup load
      - run: uv run investup export --out site/public/data
      - run: uv run investup check --out site/public/data

      - working-directory: site
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Push an empty commit when the repo has been quiet for 45.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep the daily site refresh enabled"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
